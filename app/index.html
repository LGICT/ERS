<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ERS – Enterprise Requisition System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="app">
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="#/dashboard">
        <span class="brand-logo" data-icon="cart"></span>
        <span class="brand-text"><strong>ERS</strong><small>Enterprise Requisition System</small></span>
      </a>
      <nav class="nav" id="nav"></nav>
      <div class="help-box">
        <div class="help-title"><span data-icon="headset"></span> Need Help?</div>
        <div class="help-sub">Contact Supply Chain</div>
        <div class="help-line"><span data-icon="phone"></span> <span id="helpPhone">(02) 8123-4567</span></div>
        <div class="help-line"><span data-icon="mail"></span> <span id="helpEmail">supplychain@leonio.com</span></div>
      </div>
    </aside>
    <div class="sidebar-backdrop" id="sidebarBackdrop"></div>
    <div class="main">
      <header class="topbar">
        <button class="icon-btn menu-btn" id="menuBtn" title="Menu"><span data-icon="menu"></span></button>
        <div class="page-head">
          <h1 id="pageTitle">Dashboard</h1>
          <div id="pageSub" class="page-sub"></div>
        </div>
        <div class="topbar-right">
          <div class="dropdown" id="bellWrap">
            <button class="icon-btn bell" id="bellBtn" title="Notifications"><span data-icon="bell"></span><span class="bell-dot" id="bellCount"></span></button>
            <div class="dropdown-menu notif-menu" id="bellMenu"></div>
          </div>
          <div class="dropdown" id="userWrap">
            <button class="user-btn" id="userBtn"></button>
            <div class="dropdown-menu user-menu" id="userMenu"></div>
          </div>
        </div>
      </header>
      <main class="content" id="content"></main>
    </div>
  </div>
  <div id="modalRoot"></div>
  <div id="toastRoot"></div>

  <script src="js/icons.js"></script>
  <script src="js/store.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/pages/dashboard.js"></script>
  <script src="js/pages/new-request.js"></script>
  <script src="js/pages/my-requests.js"></script>
  <script src="js/pages/approvals.js"></script>
  <script src="js/pages/catalog.js"></script>
  <script src="js/pages/budget-status.js"></script>
  <script src="js/pages/reports.js"></script>
  <script src="js/pages/settings-general.js"></script>
  <script src="js/pages/settings-users.js"></script>
  <script src="js/pages/settings-departments.js"></script>
  <script src="js/pages/settings-workflows.js"></script>
  <script src="js/pages/settings-items.js"></script>
  <script src="js/pages/settings-budget.js"></script>
  <script src="js/pages/settings-notifications.js"></script>
  <script src="js/pages/settings-preferences.js"></script>
  <script src="js/pages/settings-audit.js"></script>
  <script src="js/pages/settings-backup.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
